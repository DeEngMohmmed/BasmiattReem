<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باسميات</title>
    <style>
        /* هذا هو كود الـ CSS وضعناه داخل وسم style ليكون ملف واحد */
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* خلفية سوداء */
            font-family: sans-serif;
            color: white;
            text-align: center;
        }

        /* شاشة الدخول */
        #intro-screen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        #entry-text {
            font-size: 5rem;
            font-weight: bold;
            transition: 0.3s;
        }

        #entry-text:hover { transform: scale(1.1); color: #888; }

        .hidden { display: none; }

        /* معرض الصور */
        .masonry-grid {
            column-count: 3;
            column-gap: 15px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .item {
            display: inline-block;
            width: 100%;
            margin-bottom: 15px;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .item img {
            width: 100%;
            display: block;
            border-radius: 15px;
        }

        @media (max-width: 768px) {
            .masonry-grid { column-count: 2; }
            #entry-text { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div id="intro-screen" onclick="showGallery()">
        <h1 id="entry-text">باسميات</h1>
    </div>

    <main id="main-content" class="hidden">
        <header style="padding: 40px 0;">
            <h2>معرض الصور</h2>
        </header>
        
        <div class="masonry-grid">
            <div class="item"><img src="1.jpg"></div>
            <div class="item"><img src="2.jpg"></div>
            <div class="item"><img src="photo1.jpg"></div>
            <div class="item"><img src="photo2.jpg"></div>
        </div>
    </main>

    <script>
        function showGallery() {
            // حركة لإخفاء كلمة باسميات وإظهار الصور
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden');
        }
    </script>
</body>
</html>

<div class="masonry-grid">
    <div class="item"><img src="1.jpg"></div>
    <div class="item"><img src="2.jpg"></div>
    <div class="item"><img src="photo1.jpg"></div>
    <div class="item"><img src="3.jpg"></div> </div>
